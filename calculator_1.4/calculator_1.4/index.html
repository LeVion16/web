<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script> <!--Várd meg, amíg a html kód betöltődik.-->
</head>
<body>
    <header>
        <h1>Egyszerű számológép</h1>
    </header>
    <main>
        <section>
            <input type="number" name="" id="n1" placeholder="Első szám...">
            <select name="" id="">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" name="" id="n2" placeholder="Második szám...">
            <span style="color: white; font-weight: bold;"> = </span>
            <input type="number" name="" id="result" placeholder="Eredmény..." readonly>
        </section>
        <button type="button">Számolás</button>
    </main>
</body>
</html>

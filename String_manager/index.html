<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szövegkezelés gyakorlása</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <header>
        <h1>Szövegkezelés</h1>
    </header>
    <main>
        <article>
            <input type="text" name="" id="input-text" placeholder="Legalább 6 betűs szó...">
            <section>
                <div class="start">
                    <label for="start" id="start-label">1</label>
                    <input type="range" name="" id="start" value="0" step="1" max="10">
                </div>
                <div class="end">
                    <label for="end" id="end-label">1</label>
                    <input type="range" name="" id="end" value="0" step="1" max="20">
                </div>
            </section>
            <input type="text" name="" id="output-text" placeholder="A szöveg egy szelete..." readonly>
            <h3>Karakterek száma: </h3>
            <button type="button">Elemzés</button>
        </article>
    </main>
</body>
</html>
